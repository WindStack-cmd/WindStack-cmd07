name: Generate Snake
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: WindStack-cmd
          outputs: |
            dist/snake.svg?color_snake=%23A855F7&color_dots=%230d1117,%23003d1f,%23006b37,%2326a641,%2339d353&color_empty=%23161b22
      - name: Deploy snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
