name: Generate Snake
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: WindStack-cmd
          outputs: |
            dist/snake.svg?color_snake=%23A855F7&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39&color_empty=%23161b22
      - name: Deploy snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
